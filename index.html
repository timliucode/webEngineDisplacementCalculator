<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排氣量計算機</title>
    <link rel="icon" href="assets/images/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>排氣量計算機</h1>
            <a href="https://github.com/timliucode" class="github-link">Developed by timliucode</a>
            <br>
            <a href="https://github.com/timliucode/webEngineDisplacementCalculator" class="github-link">
                有問題或想增加快選車款請至本庫開issues
            </a>
        </header>

        <div class="main-content">
            <div class="calculator-main">
                <!-- 基本參數 -->
                <div class="input-section">
                    <h2 class="section-title">基本參數</h2>
                    <div class="input-group">
                        <label for="cylinders">缸數</label>
                        <div class="input-row">
                            <input type="number" id="cylinders" min="1" oninput="calculate()">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="diameter">缸徑</label>
                        <div class="input-row">
                            <input type="number" id="diameter" min="1" step="0.1" oninput="calculate()">
                            <span class="unit">mm</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="stroke">行程</label>
                        <div class="input-row">
                            <input type="number" id="stroke" min="1" step="0.1" oninput="calculate()">
                            <span class="unit">mm</span>
                        </div>
                    </div>
                </div>

                <!-- 改裝目標 -->
                <div class="input-section">
                    <h2 class="section-title">改裝目標</h2>
                    <div class="input-group">
                        <div class="input-row">
                            <select id="selectNewBore" oninput="newBoreUnit()">
                                <option value="0" selected>缸徑</option>
                                <option value="1">搪缸</option>
                            </select>
                            <input type="number" id="NewDiameter" min="1" step="0.1" oninput="calculate()">
                            <span class="unit" id="newBoreUnit">mm</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="input-row">
                            <select id="selectNewStroke" oninput="newStrokeUnit()">
                                <option value="0" selected>拉條</option>
                                <option value="1">行程</option>
                            </select>
                            <input type="number" id="NewStroke" min="1" step="0.1" oninput="calculate()">
                            <span class="unit" id="newStrokeUnit">條</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="combustionChamber">燃燒容積</label>
                        <div class="input-row">
                            <input type="number" id="combustionChamber" min="1" step="0.1" oninput="calculate()">
                            <span class="unit">cc</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="rpm">引擎轉速</label>
                        <div class="input-row">
                            <input type="number" id="rpm" min="1" step="100" value="10000" oninput="calculate()">
                            <span class="unit">rpm</span>
                        </div>
                    </div>
                </div>

                <!-- 計算結果 -->
                <div class="results-section">
                    <h2 class="section-title">計算結果</h2>
                    <div class="results-grid">
                        <div class="result-item">
                            <label>壓縮比</label>
                            <span id="compressionRatio">N/A</span>
                        </div>
                        <div class="result-item">
                            <label>排氣量</label>
                            <span id="result">0.00 cc</span>
                        </div>
                        <div class="result-item">
                            <label>改後缸徑</label>
                            <span id="newboremm">0.00 mm</span>
                        </div>
                        <div class="result-item">
                            <label>改後行程</label>
                            <span id="newstrokemm">0.00 mm</span>
                        </div>
                        <div class="result-item">
                            <label>改後排量</label>
                            <input type="number" id="newResult" min="1" step="0.1"> cc
                        </div>
                        <div class="result-item">
                            <label>相差倍率</label>
                            <span id="difference">0.00</span>
                        </div>
                        <div class="result-item">
                            <label>相差百分比</label>
                            <span id="differencePercent">0.00 %</span>
                        </div>
                        <div class="result-item">
                            <label>相差排氣量</label>
                            <span id="differenceResult">0.00 cc</span>
                        </div>
                        <div class="result-item">
                            <label>改前活塞速度</label>
                            <span id="mps">0.00 m/s</span>
                        </div>
                        <div class="result-item">
                            <label>改後活塞速度</label>
                            <span id="newmps">0.00 m/s</span>
                        </div>
                    </div>

                    <div class="button-group">
                        <button onclick="clearInputs()">清除</button>
                        <button onclick="calculate(0)">計算排氣量</button>
                        <button onclick="calculate(1)">計算缸徑</button>
                        <button onclick="calculate(2)">計算行程</button>
                    </div>
                </div>
            </div>

            <!-- 快速選擇車款 -->
            <div class="presets">
                <h2 class="section-title">快速選擇車款</h2>

                <div class="preset-section">
                    <h3>YAMAHA</h3>
                    <div class="preset-buttons">
                        <button class="preset-button"
                            onclick="setCarSpecs(1, 52.4, 57.9)">5ML車系(勁戰1~5、GTR、RAY、BW'S X、BW'S R)</button>
                        <button class="preset-button" onclick="setCarSpecs(1, 52, 58.7)">B8R125車系(六代戰、BWS2.0、七代戰)</button>
                        <button class="preset-button"
                            onclick="setCarSpecs(1, 58, 58.7)">SMAX / FORCE / FORCE 2.0 / AUGUR / NMAX / R15 V3、V4 / Cygnus XR 155 / AEROX</button>
                    </div>
                </div>

                <div class="preset-section">
                    <h3>SYM</h3>
                    <div class="preset-buttons">
                        <button class="preset-button" onclick="setCarSpecs(1, 54, 54.4)">JET S / SR</button>
                        <button class="preset-button" onclick="setCarSpecs(1, 53, 56.5)">JET SL / SL SuperC</button>
                        <button class="preset-button" onclick="setCarSpecs(1, 59, 57.8)">DRG / MMBCU / JET SL+ / JET SL+ SuperC</button>
                    </div>
                </div>

                <div class="preset-section">
                    <h3>KYMCO</h3>
                    <div class="preset-buttons">
                        <button class="preset-button" onclick="setCarSpecs(1, 54, 54.5)">Racing S 125、RTS 125</button>
                        <button class="preset-button" onclick="setCarSpecs(1, 59, 54.5)">Racing S 150 / RCS Moto</button>
                        <button class="preset-button" onclick="setCarSpecs(1, 62, 58)">KRV車系</button>
                        <button class="preset-button" onclick="setCarSpecs(1, 56, 54.5)">RTS135</button>
                        <button class="preset-button" onclick="setCarSpecs(1, 62, 54.5)">RTS165</button>
                    </div>
                </div>

                <div class="preset-section">
                    <h3>PGO</h3>
                    <div class="preset-buttons">
                        <button class="preset-button" onclick="setCarSpecs(1, 52.4, 57.8)">TIGRA125</button>
                        <button class="preset-button" onclick="setCarSpecs(1, 57.4, 58)">TIGRA150</button>
                        <button class="preset-button" onclick="setCarSpecs(1, 61, 58)">TIG 170</button>
                    </div>
                </div>

                <div class="preset-section">
                    <h3>SUZUKI</h3>
                    <div class="preset-buttons">
                        <button class="preset-button" onclick="setCarSpecs(1, 62, 48.8)">GSX-R150</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/calculator.js"></script>
</body>

</html>
